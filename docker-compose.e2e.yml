name: knowflow-e2e

services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: e2e-root-password
      MYSQL_DATABASE: knowflow_e2e
      MYSQL_USER: knowflow_e2e
      MYSQL_PASSWORD: e2e-password
    volumes:
      - mysql-e2e-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "127.0.0.1:15673:5672"
      - "127.0.0.1:15674:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "127.0.0.1:16333:6333"
      - "127.0.0.1:16334:6334"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mysql-e2e-data:
