spring:
  application:
    name: knowflow-app-test
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 测试专用主密钥（Base64 AES-256），仅用于本地/CI 测试，非真实 Secret
knowflow:
  security:
    master-key: ${KNOWFLOW_SECURITY_MASTER_KEY:S25vd0Zsb3ctVGVzdC1NYXN0ZXItS2V5LTAxMjM0NTY=}
    encryption-version: 1
  model-client:
    allow-local-base-url: true
