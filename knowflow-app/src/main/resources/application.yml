server:
  port: ${SERVER_PORT:8080}

spring:
  threads:
    virtual:
      enabled: false
  application:
    name: knowflow-app
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:knowflow}?useUnicode=true&serverTimezone=UTC
    username: ${MYSQL_USER:knowflow}
    password: ${MYSQL_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

knowflow:
  security:
    master-key: ${KNOWFLOW_SECURITY_MASTER_KEY:}
    encryption-version: ${KNOWFLOW_SECURITY_ENCRYPTION_VERSION:1}
  model-client:
    connect-timeout: ${KNOWFLOW_MODEL_CONNECT_TIMEOUT:10s}
    read-timeout: ${KNOWFLOW_MODEL_READ_TIMEOUT:60s}
    total-timeout: ${KNOWFLOW_MODEL_TOTAL_TIMEOUT:90s}
    max-concurrency: ${KNOWFLOW_MODEL_MAX_CONCURRENCY:8}
    allow-local-base-url: ${KNOWFLOW_MODEL_ALLOW_LOCAL_BASE_URL:false}
  rabbit:
    prefix: ${KNOWFLOW_RABBIT_PREFIX:knowflow}
    work-queue: ${KNOWFLOW_RABBIT_WORK_QUEUE:index.work}
    processing-lease-timeout: ${KNOWFLOW_RABBIT_PROCESSING_LEASE_TIMEOUT:10m}
    recovery-scan-interval: ${KNOWFLOW_RABBIT_RECOVERY_SCAN_INTERVAL:1m}
  chunking:
    target-chars: ${KNOWFLOW_CHUNK_TARGET_CHARS:800}
    overlap-chars: ${KNOWFLOW_CHUNK_OVERLAP_CHARS:200}
    max-chunks: ${KNOWFLOW_CHUNK_MAX_CHUNKS:64}
  embedding:
    base-url: ${KNOWFLOW_EMBEDDING_BASE_URL:}
    api-key: ${KNOWFLOW_EMBEDDING_API_KEY:}
    model: ${KNOWFLOW_EMBEDDING_MODEL:qwen3.7-text-embedding}
    dimensions: ${KNOWFLOW_EMBEDDING_DIMENSIONS:1024}
    connect-timeout-millis: ${KNOWFLOW_EMBEDDING_CONNECT_TIMEOUT:10000}
    read-timeout-millis: ${KNOWFLOW_EMBEDDING_READ_TIMEOUT:60000}
  qdrant:
    base-url: ${QDRANT_URL:http://127.0.0.1:6333}
    collection-name: ${QDRANT_COLLECTION:knowflow_dense_v1}
    connect-timeout-millis: ${KNOWFLOW_QDRANT_CONNECT_TIMEOUT:5000}
    read-timeout-millis: ${KNOWFLOW_QDRANT_READ_TIMEOUT:30000}
  rag:
    catalog-limit: ${KNOWFLOW_RAG_CATALOG_LIMIT:50}
    top-k: ${KNOWFLOW_RAG_TOP_K:8}
    score-threshold: ${KNOWFLOW_RAG_SCORE_THRESHOLD:0.2}
    context-char-budget: ${KNOWFLOW_RAG_CONTEXT_CHAR_BUDGET:3000}
    router-context-char-limit: ${KNOWFLOW_RAG_ROUTER_CONTEXT_CHAR_LIMIT:1500}
    snippet-char-limit: ${KNOWFLOW_RAG_SNIPPET_CHAR_LIMIT:200}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false
    env:
      enabled: false
    configprops:
      enabled: false
    heapdump:
      enabled: false
    loggers:
      enabled: false
